# Flow de referencia para DMA_JAIVA.
# Broder NO ejecuta este YAML: solo POSTea EventEnvelope al ingest.
# Jaiba recibe, bufferiza y decide el destino (ClickHouse recomendado
# para histórico de visión; PostgreSQL para configuración; etc.).

id: broder-vision-ingest

# El endpoint /api/v1/ingest/events (lab DMA_JAIVA) debe:
#   1. aceptar el JSON de broder con 202 Accepted
#   2. encolar paquetes sin bloquear al productor
#   3. persistir por lotes hacia el motor histórico elegido

database_connections:
  vision_history:
    type: clickhouse
    # Credenciales solo en Jaiba / Connection Manager — nunca en Broder.
    connection: clickhouse_dma

engine:
  queue_capacity: 1024
  max_concurrency: 4
  memory:
    maximum_percent: 42

processors:
  - id: note
    type: generate_records
    config:
      records:
        - info: "Sustituir por el consumer del ingest HTTP de Broder."
          target: temporal.vision_detection
          engine: clickhouse

connections:
  - from: note
    relationship: success
    to: note
