# Infra opcional para sinks de Jaiba (no es el esqueleto runtime de Broder).
# ClickHouse / PostgreSQL los consume Jaiba si el DAG persiste; visión/app
# funcionan sin estos servicios. DMA_JAIVA (lab KPI) es un circuito aparte.
name: little-brother

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: little-brother-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-temporal}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/0001_temporal_vision_detection.sql:/docker-entrypoint-initdb.d/0001_temporal_vision_detection.sql:ro
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/ping' | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16.4
    container_name: little-brother-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-little_brother}
      POSTGRES_USER: ${POSTGRES_USER:-little_brother}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./core/rs/apps/vision-inference/web
    container_name: little-brother-web
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  clickhouse_data:
  postgres_data:
